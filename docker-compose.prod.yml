# Production (SPEC §8.2). Dev dùng docker-compose.yml (có RustFS giả lập S3).
# Chạy: make prod-up   (đọc biến từ .env.production)
# Ảnh lưu trên S3 thật: AWS S3 hoặc Cloudflare R2, cấu hình qua S3_* — không có container S3 ở đây.
name: restaurant-prod

x-api-env: &api-env
  RAILS_ENV: production
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Thiếu SECRET_KEY_BASE}
  FORCE_SSL: ${FORCE_SSL:-false}
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
  DB_HOST: db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET}
  SOCKET_JWT_SECRET: ${SOCKET_JWT_SECRET:?Thiếu SOCKET_JWT_SECRET}
  PUBLIC_URL: ${PUBLIC_URL:-}
  LAN_IP: ${LAN_IP:-localhost}
  WEB_PORT: ${WEB_PORT:-80}
  TZ: ${TZ}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Thiếu S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Thiếu S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:?Thiếu S3_BUCKET}
  S3_REGION: ${S3_REGION}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    image: restaurant-api:prod
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/v1/health"]
      interval: 10s
      retries: 12
      start_period: 20s

  worker:
    image: restaurant-api:prod
    restart: unless-stopped
    command: bundle exec sidekiq
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }   # chờ api migrate xong

  socket:
    build:
      context: ./socket
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SOCKET_PORT: 4000
      REDIS_URL: redis://redis:6379/0
      SOCKET_JWT_SECRET: ${SOCKET_JWT_SECRET}
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api: { condition: service_healthy }
      socket: { condition: service_started }

volumes:
  pg_data:
  redis_data:
