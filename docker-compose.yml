name: restaurant

x-api-env: &api-env
  RAILS_ENV: development
  DB_HOST: db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  SOCKET_JWT_SECRET: ${SOCKET_JWT_SECRET}
  LAN_IP: ${LAN_IP}
  WEB_PORT: ${WEB_PORT}
  TZ: ${TZ}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment: *api-env
    volumes:
      - ./api:/app
      - bundle:/usr/local/bundle
    ports:
      - "${API_PORT}:3000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    stdin_open: true
    tty: true

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: bundle exec sidekiq
    environment: *api-env
    volumes:
      - ./api:/app
      - bundle:/usr/local/bundle
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  socket:
    build: ./socket
    environment:
      SOCKET_PORT: 4000
      REDIS_URL: ${REDIS_URL}
      SOCKET_JWT_SECRET: ${SOCKET_JWT_SECRET}
    volumes:
      - ./socket:/app
      - socket_node_modules:/app/node_modules
    ports:
      - "${SOCKET_PORT}:4000"
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./web
    environment:
      API_TARGET: http://api:3000
      SOCKET_TARGET: http://socket:4000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT}:5173"
    depends_on:
      - api
      - socket

volumes:
  pg_data:
  redis_data:
  bundle:
  socket_node_modules:
  web_node_modules:
