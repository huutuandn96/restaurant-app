name: restaurant

x-api-env: &api-env
  RAILS_ENV: development
  DB_HOST: db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  SOCKET_JWT_SECRET: ${SOCKET_JWT_SECRET}
  LAN_IP: ${LAN_IP}
  WEB_PORT: ${WEB_PORT}
  TZ: ${TZ}
  RESTAURANT_NAME: ${RESTAURANT_NAME:-Nhà hàng Demo}
  RESTAURANT_ADDRESS: ${RESTAURANT_ADDRESS:-}
  RESTAURANT_PHONE: ${RESTAURANT_PHONE:-}
  RESTAURANT_BILL_FOOTER: ${RESTAURANT_BILL_FOOTER:-Cảm ơn quý khách, hẹn gặp lại!}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3 giả lập (SPEC D9) — RustFS, tương thích S3 API, có web console.
  # Production: bỏ s3 + s3-init, trỏ S3_* sang AWS S3.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3_data:/data
    ports:
      - "${S3_CONSOLE_PORT}:9001"

  # Tạo bucket 1 lần (bằng chính AWS CLI) rồi thoát
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null && { echo "bucket ready"; exit 0; }
          aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 && { echo "bucket created"; exit 0; }
          echo "waiting for s3..."; sleep 2
        done
        exit 1

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment: *api-env
    volumes:
      - ./api:/app
      - bundle:/usr/local/bundle
    ports:
      - "${API_PORT}:3000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    stdin_open: true
    tty: true

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: bundle exec sidekiq
    environment: *api-env
    volumes:
      - ./api:/app
      - bundle:/usr/local/bundle
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  socket:
    build: ./socket
    environment:
      SOCKET_PORT: 4000
      REDIS_URL: ${REDIS_URL}
      SOCKET_JWT_SECRET: ${SOCKET_JWT_SECRET}
    volumes:
      - ./socket:/app
      - socket_node_modules:/app/node_modules
    ports:
      - "${SOCKET_PORT}:4000"
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./web
    environment:
      API_TARGET: http://api:3000
      SOCKET_TARGET: http://socket:4000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT}:5173"
    depends_on:
      - api
      - socket

volumes:
  pg_data:
  redis_data:
  s3_data:
  bundle:
  socket_node_modules:
  web_node_modules:
